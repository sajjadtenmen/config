name: Update proxy subscriptions

on:
  workflow_dispatch:
  schedule:
    # Once every 24 hours, at 03:17 UTC.
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: update-proxy-subscriptions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Download country database
        run: |
          mkdir -p .cache
          curl --fail --location --retry 3 \
            --output .cache/GeoLite2-Country.mmdb \
            https://github.com/P3TERX/GeoLite.mmdb/raw/download/GeoLite2-Country.mmdb

      - name: Collect subscriptions
        run: python collector.py

      - name: Download Mihomo
        run: |
          curl --fail --location --retry 3 \
            --output .cache/mihomo.gz \
            https://github.com/MetaCubeX/mihomo/releases/download/v1.19.29/mihomo-linux-amd64-compatible-v1.19.29.gz
          gzip --decompress .cache/mihomo.gz
          chmod +x .cache/mihomo

      - name: URL-test and rank subscriptions
        run: |
          mkdir -p .cache/mihomo-home
          .cache/mihomo -d .cache/mihomo-home \
            -f subscriptions/mihomo.yaml \
            -ext-ctl 127.0.0.1:9090 \
            > .cache/mihomo.log 2>&1 &
          MIHOMO_PID=$!
          trap 'kill "$MIHOMO_PID" 2>/dev/null || true' EXIT
          if ! python rank_configs.py --batch-size 64 --retries 2; then
            echo "Mihomo startup/test log:"
            cat .cache/mihomo.log
            exit 1
          fi

      - name: Commit updated subscriptions
        run: |
          if [ -z "$(git status --porcelain -- subscriptions/)" ]; then
            echo "Subscriptions are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add subscriptions/all.txt subscriptions/base64.txt \
            subscriptions/mihomo.yaml subscriptions/proxies.yaml \
            subscriptions/tested.txt subscriptions/tested-base64.txt \
            subscriptions/mihomo-tested.yaml subscriptions/proxies-tested.yaml \
            subscriptions/latency.json subscriptions/sources-status.json
          git commit -m "chore: update proxy subscriptions"
          git push
